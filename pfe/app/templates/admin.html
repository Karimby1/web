{% extends "base.html" %}
{% block title %}Admin · PFE{% endblock %}
{% block content %}
<div class="grid cols-2">
  <div class="card">
    <h2>Admin Panel</h2>
    <p class="sub">Administrative tools</p>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <a class="btn" href="{{ url_for('dashboards.view') }}">See Dashboards</a>
      <button class="btn secondary" id="predict">Make Prediction (Placeholder)</button>
    </div>
    <pre id="out" style="margin-top:12px; background:#061023; padding:12px; border-radius:10px; border:1px solid rgba(99,102,241,.2)"></pre>
  </div>

  <div class="card">
    <h3>System</h3>
    <table class="table">
      <tr><th>Environment</th><td>Development</td></tr>
      <tr><th>Auth</th><td>Flask-Login (session)</td></tr>
      <tr><th>DB</th><td>MySQL (XAMPP)</td></tr>
    </table>
  </div>
</div>

<script>
document.getElementById("predict").onclick = async () => {
  const res = await fetch("/admin/predict", {method:"POST"});
  const data = await res.json();
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);
};
</script>
{% endblock %}
