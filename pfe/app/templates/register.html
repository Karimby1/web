{% extends "base.html" %}
{% block title %}Register · PFE{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
  <h2>Create your account</h2>
  <p class="sub">You'll get the <strong>user</strong> role by default</p>
  <form method="post" style="margin-top:12px;">
    <div>
      <label>Email</label>
      <input type="email" name="email" value="{{ request.form.get('email','') }}" required>
    </div>
    <div style="margin-top:10px">
      <label>Password</label>
      <input type="password" name="password" required minlength="6">
    </div>
    <div style="margin-top:10px">
      <label>Confirm</label>
      <input type="password" name="confirm" required minlength="6">
    </div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button class="btn" type="submit">Register</button>
      <a class="btn secondary" href="{{ url_for('auth.login') }}" role="button">Back to login</a>
    </div>
  </form>
</div>
{% endblock %}
