{% extends "base.html" %}
{% block title %}Dashboards · PFE{% endblock %}
{% block content %}

<!-- HERO FULL-WIDTH -->
<section class="hero">
  <div class="hero-inner">
    <h1>Welcome To CMR Analytics</h1>
    <p class="tagline">Explore Real-Time Data and Predictive Insights</p>

    <div class="dash-actions">
      <a class="btn btn-lg" href="{{ url_for('dash.powerbi') }}">
        Power BI
      </a>
      {% if is_admin() %}
      <a class="btn btn-lg" href="{{ url_for('dash.prediction') }}">
        Make a Prediction
      </a>
      {% endif %}
    </div>
  </div>
</section>

<!-- (optionnel) zone infos courtes sous le hero -->
<!--
<section class="hero-notes">
  Connect your Power BI publish link in <code>dashboards/routes.py</code> → <code>powerbi_url</code>.
</section>
-->

<style>
  /* ---- HERO styles (local au template) ---- */
  .hero{
    position:relative;
    min-height: 68vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    isolation:isolate;
    padding: 48px 16px;
    background: transparent;


  }
  .hero::after{
    /* léger motif pour rappeler l'image */
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(1200px 600px at 20% 80%, rgba(255,255,255,.04), transparent 60%);
    pointer-events:none;
  }
  .hero-inner{
    max-width: 1100px;
    text-align:center;
    color:#fff;
  }
  .hero h1{
    font-size: clamp(36px, 6vw, 72px);
    line-height: 1.05;
    margin: 0 0 16px 0;
    letter-spacing:.2px;
    font-weight: 800;
  }
  .hero .tagline{
    font-size: clamp(14px, 2.2vw, 18px);
    opacity:.9;
    margin: 0 auto 28px auto;
    max-width: 600px;
  }
  .hero .cta{
    display:inline-flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  /* arrondis type "pill" pour coller à ton style de boutons */
  .hero .btn{
    border-radius: 999px;
    padding: 12px 22px;
  }

  /* (optionnel) texte d’aide sous le hero */
  .hero-notes{
    max-width: 980px;
    margin: 18px auto 0;
    padding: 14px;
    border-radius: 12px;
    border: 1px dashed rgba(99,102,241,.35);
    color: #4b5563;
  }
</style>

{% endblock %}
